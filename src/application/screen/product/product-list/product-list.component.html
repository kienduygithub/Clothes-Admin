<div class="router-static">
    <div class="search-and-filter">
        <div class="search-input-container">
            <input nbInput type="text" placeholder="Nhập tên sản phẩm">
        </div>
        <button nbButton class="util-box">
            <img class="common-icon" [src]="icon_filter" />
        </button>
        <button nbButton class="util-box">
            <img class="common-icon" [src]="icon_refresh" />
        </button>
    </div>
    <div class="table-responsive">
        <table class="table">
            <thead>
                <tr>
                    <th>NO</th>
                    <th>Mã sản phẩm</th>
                    <th>Hình ảnh</th>
                    <th>Tên sản phẩm</th>
                    <th>Xuất xứ</th>
                    <th>Giá thành</th>
                    <th>Tồn kho</th>
                    <th style="color: transparent">Hành động</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let product of allProducts | paginate: paging;let i = index"
                    (click)="onUpdateProduct(product.id!)">
                    <td style="width: 5%;">
                        <span style="font-size: 14px;">
                            {{offset + i}}
                        </span>
                    </td>
                    <td style="width: 13%;">
                        <span style="font-size: 14px;">
                            {{product.id}}
                        </span>
                    </td>
                    <td style="width: 13%;">
                        <div class="image-container">
                            <img *ngIf="product.image_urls?.length! > 0"
                                src="{{preImage}}/{{product.image_urls![0].image_url}}">
                            <img *ngIf="product.image_urls?.length! === 0" [src]="image_not_found">
                        </div>
                    </td>
                    <td style="width: 18%;">
                        <span style="font-size: 14px;">
                            {{product.product_name}}
                        </span>
                    </td>
                    <td style="width: 12%;">
                        <span style="font-size: 14px;">
                            {{product.origin}}
                        </span>
                    </td>
                    <td style="width: 14%;">
                        <span style="font-size: 14px;">
                            đ{{product.unit_price}}
                        </span>
                    </td>
                    <td style="width: 14%;">
                        <span style="font-size: 14px;">
                            {{product.stock_product}}
                        </span>
                    </td>
                    <td style="width: 10%;" (click)="$event.stopPropagation()">
                        <div class="list-actions">
                            <nb-icon class="common-icon" icon="icon_edit" pack="mainIcon" [nbTooltip]="'Chỉnh sửa'"
                                nbTooltipPlacement="bottom" (click)="onUpdateProduct(product.id!)"></nb-icon>
                            <nb-icon class="common-icon" icon="icon_delete" pack="mainIcon" [nbTooltip]="'Xóa'"
                                nbTooltipPlacement="bottom" (click)="onConfirmDeleteProduct(product)">
                            </nb-icon>
                        </div>
                    </td>
                </tr>
                <tr *ngIf="allProducts.length === 0">
                    <td class="table-no-data text-center" colspan="11">
                        Không có dữ liệu
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div style="display: flex; align-items: center;">
        <div class="total-items">
            <span>Tổng số: {{ paging.totalItems }}</span>
        </div>
        <div class="pagination-flex">
            <pagination-controls (pageChange)="onPageChange($event)" previousLabel="" nextLabel="">
            </pagination-controls>
        </div>
    </div>
</div>
