<div class="screen">
    <div class="layout-size">
        <div class="d-flex align-items-center mb-2 header-form">
            <div class="mr-3 icons_arrow_line" (click)="onCancel()">
                <img src="{{ icons_arrow_line }}" class="icon-back" />
            </div>
            <div class="d-flex flex-column">
                <label class="header-title">
                    {{
                    action === actionWebs.CREATE
                    ? "Thêm danh mục"
                    : updatedCategory && updatedCategory.category_name
                    }}
                </label>
            </div>
            <div class="button-header">
                <button nbButton *ngIf="action === actionWebs.UPDATE" class="button-cancel-form" (click)="onCancel()">
                    Hủy
                </button>
                <button nbButton class="button-submit-form ml-2" (click)="onSave()">
                    {{
                    action === actionWebs.CREATE ? 'Thêm mới' : 'Lưu'
                    }}
                </button>
            </div>
        </div>
        <div class="body-form">
            <ng-container [ngTemplateOutlet]="cruRef"></ng-container>
        </div>
    </div>
</div>

<ng-template #cruRef>
    <form *ngIf="cruForm" [formGroup]="cruForm">
        <span class="sub-title">Thông tin chi tiết</span>
        <div class="info-wrapper">
            <div class="info-left">
                <div class="info-logo no-image" *ngIf="cruForm.get('image_url')?.value === '' && !selectedFile">
                    <div class="logo-wrapper">
                        <img [src]="icon_no_logo_shop">
                    </div>
                    <div class="upload-logo-wrapper">
                        <label class="upload-image" for="logo-files">
                            <img [src]="icon_upload_v3" />
                            <span>Tải ảnh</span>
                        </label>
                        <input #imageFile type="file" id="logo-files" accept=".png, .jpg, .jpeg" [hidden]="true"
                            (change)="onChangeLogoFile(imageFile.files)" />
                    </div>
                </div>
                <div class="info-logo has-image" *ngIf="cruForm.get('image_url')?.value !== ''">
                    <div class="logo-wrapper" *ngIf="selectedFile">
                        <img [src]="cruForm.get('image_url')?.value">
                    </div>
                    <div class="logo-wrapper" *ngIf="!selectedFile">
                        <img [src]="preImage + '/' + cruForm.get('image_url')?.value">
                    </div>
                    <div class="upload-logo-wrapper">
                        <label class="upload-image" for="logo-files">
                            <img [src]="icon_upload_v3" />
                            <span>Tải ảnh</span>
                        </label>
                        <input #imageFile type="file" id="logo-files" accept=".png, .jpg, .jpeg" [hidden]="true"
                            (change)="onChangeLogoFile(imageFile.files)" />
                    </div>
                </div>
            </div>
            <div class="info-right">
                <div class="info">
                    <label>
                        Tên danh mục<span class="required">*</span>
                    </label>
                    <div class="input-container">
                        <input nbInput type="text" formControlName="category_name" placeholder="Nhập tên danh mục"
                            [ngClass]="{'invalid-form': (cruForm.get('category_name')?.dirty || isSubmit) && cruForm.get('category_name')?.invalid}">
                        <ng-container
                            *ngIf="(cruForm.get('category_name')?.dirty || isSubmit) && cruForm.get('category_name')?.invalid">
                            <p *ngIf="cruForm.get('category_name')?.hasError('required')" class="vali-text-false">
                                Tên danh mục không được bỏ trống
                            </p>
                            <p *ngIf="cruForm.get('category_name')?.hasError('unique')" class="vali-text-false">
                                Tên danh mục đã tồn tại
                            </p>
                        </ng-container>
                    </div>
                </div>
                <div class="info">
                    <label>Mô tả</label>
                    <div class="input-container">
                        <textarea nbInput formControlName="description" id="description" placeholder="Mô tả"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </form>
</ng-template>
